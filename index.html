    function removeHeroImage(){heroImageDraft='';let preview=document.getElementById('hero-preview');if(preview){preview.style.backgroundImage='';preview.textContent='Cover image preview'}let input=document.getElementById('ef-hero');if(input)input.value=''}
    function escapeHtml(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(x=''){return escapeHtml(x)}
    function saveEvent(id){let name=document.getElementById('ef-name').value.trim(),venue=document.getElementById('ef-venue').value.trim(),area=document.getElementById('ef-area').value.trim(),about=document.getElementById('ef-about').value.trim(),venueAbout=document.getElementById('ef-vabout').value.trim(),dates=document.getElementById('ef-dates').value.split(',').map(x=>x.trim()).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)),vendors=document.getElementById('ef-vendors').value.split('\n').map(line=>{let [n,t,p,q]=line.split('|').map(x=>x.trim());return n&&Number(p)>0&&Number(q)>=0?{name:n,type:t||'Entry pass',price:Number(p),quantity:Number(q)}:null}).filter(Boolean);if(!name||!venue||!dates.length){toast('Add an event name, venue, and at least one valid date.');return}let previous=id?events.find(x=>x.id===id):null;let eventObj={id:id||name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString().slice(-4),name,venue,area:area||'Ahmedabad',city:area||'Ahmedabad',about,venueAbout,dates,vendors,heroImage:heroImageDraft,tone:previous?.tone||'cover-'+(events.length%6+1),tag:previous?.tag||'JUST ADDED'};if(id){let i=events.findIndex(x=>x.id===id);events[i]=eventObj}else events.unshift(eventObj);persist();closeModal();renderAdmin();toast('Event saved and live on the client site.')}
    function editEvent(id){eventForm(id)}
    renderClient();
  </script>
</body>
